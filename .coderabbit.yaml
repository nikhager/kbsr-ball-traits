# CodeRabbit AI review (free for public repos). Reviews every PR and every
# push to it, and reads CLAUDE.md (plus REVIEW.md, if added) as the rules.
# Tuned to stay quiet: no poems, diagrams, label/reviewer suggestions, and no
# summary written into the PR description (that's ours to write).
# Reference: https://docs.coderabbit.ai/reference/configuration
language: en-US

reviews:
    profile: chill
    high_level_summary: false
    poem: false
    review_status: true
    collapse_walkthrough: true
    changed_files_summary: false
    sequence_diagrams: false
    related_issues: false
    related_prs: false
    suggested_labels: false
    suggested_reviewers: false

    auto_review:
        enabled: true
        drafts: false

    # Not worth reviewing: third-party code and binary images.
    path_filters:
        - "!site/js/vendor/**"
        - "!site/images/**"
        - "!docs/design/**/sources/**"

    path_instructions:
        - path: "site/data/traits.json"
          instructions: >-
              Data-only file; scripts/validate_traits.py already checks structure,
              names, icons and ordering in CI, so don't repeat those checks. Focus on
              the CLAUDE.md content rules the validator can't check: filter tags
              match the effect text (every shot type a trait boosts is tagged),
              effect text reads as verbatim game text with any editorial fill-in in
              [square brackets], and `updated` is set to the push/merge date in
              America/Los_Angeles time (not UTC).
        - path: "site/_headers"
          instructions: >-
              Security headers for the live site. Flag anything that weakens the
              CSP (unsafe-inline, unsafe-eval, wildcards, new hosts) and check that
              any new host is actually needed by the page.
        - path: "site/js/**"
          instructions: >-
              Plain browser JS, no build step. Build elements with the el() helper
              and set text with textContent. Never pass strings to innerHTML,
              outerHTML, insertAdjacentHTML, document.write, eval, new Function, a
              string setTimeout, or a script element's src/text: the CSP enforces
              Trusted Types, so these throw in supporting browsers and break the
              page. Any new outside script, font, image or API must also be added
              to the CSP in site/_headers. Don't edit site/js/vendor/.

    # PR titles are already checked by .github/workflows/pr-title.yml, and
    # descriptions follow our own template.
    pre_merge_checks:
        title:
            mode: "off"
        description:
            mode: "off"

knowledge_base:
    code_guidelines:
        # CLAUDE.md and AGENTS.md are read by default; this adds REVIEW.md.
        filePatterns:
            - "REVIEW.md"

chat:
    auto_reply: true
