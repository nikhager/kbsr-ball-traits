# Weekly dependency update PRs. Uncomment a block once that manifest exists,
# and set `directory` if the code lives in a subfolder (e.g. /api or /web).
#
# Every PR is assigned to Nik and labelled `needs-nik-review`, so it shows up
# under github.com/pulls -> Assigned; the weekly PR digest (nikhager/workflows)
# lists all open Dependabot PRs. Matches CLAUDE.md (Dependabot PRs are Ask):
# Actions bumps are CI config, and Nik merges all dependency PRs himself.
# Setting `labels` replaces Dependabot's defaults, so `dependencies` is listed
# too. Labels that don't exist are skipped; both already exist in this repo.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: chore
      assignees: [nikhager]
      labels: [dependencies, needs-nik-review]

