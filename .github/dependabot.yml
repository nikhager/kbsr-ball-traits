# Weekly dependency update PRs. Uncomment a block once that manifest exists,
# and set `directory` if the code lives in a subfolder (e.g. /api or /web).
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: chore

