# PR titles become the commit message on main (squash-merge),
# so check they follow Conventional Commits: feat: …, fix: …, chore: …
name: PR title

on:
    pull_request:
        types: [opened, edited, synchronize, reopened]

permissions:
    pull-requests: read

jobs:
    conventional-title:
        runs-on: ubuntu-latest
        steps:
            - uses: amannn/action-semantic-pull-request@v5
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
