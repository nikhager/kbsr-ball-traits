name: Validate data

on:
    pull_request:
        paths:
            - "site/data/**"
            - "site/images/icons/**"
            - "scripts/validate_traits.py"
            - ".github/workflows/validate.yml"
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    traits:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Check traits.json
              run: python3 scripts/validate_traits.py
