name: Validate data

on:
    pull_request:
        paths:
            - "site/data/**"
            - "site/images/icons/**"
            - "site/index.html"
            - "site/js/**"
            - "site/css/**"
            - "scripts/**"
            - ".github/workflows/validate.yml"
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    traits:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Check traits.json
              run: python3 scripts/validate_traits.py
            - name: Check asset version tags
              if: ${{ !cancelled() }}
              run: python3 scripts/version_assets.py --check
            - name: Test the scripts
              if: ${{ !cancelled() }}
              run: python3 -m unittest discover -s scripts -v
