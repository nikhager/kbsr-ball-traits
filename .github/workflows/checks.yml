name: Checks

# Runs on every PR (no path filters) because "checks" is a required status
# check on main: a required check that a PR skips would block it forever.
on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
            - name: Check traits.json
              run: python3 scripts/validate_traits.py
            - name: Check asset version tags
              if: ${{ !cancelled() }}
              run: python3 scripts/version_assets.py --check
            - name: Test the scripts
              if: ${{ !cancelled() }}
              run: python3 -m unittest discover -s scripts -v
            - name: Test the page code
              if: ${{ !cancelled() }}
              run: node --test tests/*.test.mjs
