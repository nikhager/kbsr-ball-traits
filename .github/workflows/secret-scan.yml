name: Secret scan

# Scans every push and PR for committed secrets (API keys, tokens, private keys).
# Free for personal accounts. A finding fails the check; false positives go in
# .gitleaksignore (fingerprint per line).

on:
    push:
    pull_request:

permissions:
    contents: read
    pull-requests: read

jobs:
    gitleaks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_ENABLE_COMMENTS: false
